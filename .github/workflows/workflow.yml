name: Build and Push

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: aethos-reposilite
          server-username: REPOSILITE_USERNAME
          server-password: REPOSILITE_TOKEN

      - name: Build with Maven
        run: mvn -B clean package

      - name: Check published version
        id: published
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -I "https://reposilite.aethosserver.de/releases/de/aethos/lib/$VERSION/lib-$VERSION.pom")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Deploy to Reposilite
        if: steps.published.outputs.status == '404'
        run: mvn -B deploy
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

